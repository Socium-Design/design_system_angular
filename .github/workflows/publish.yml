name: Publish @socium-design/angular-components

# Publishes to GitHub Packages when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# The tag must match the version in packages/angular/angular-components/package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@socium-design'
          cache: npm
          cache-dependency-path: packages/angular/package-lock.json
      - name: Tag matches package version
        run: |
          VERSION=$(node -p "require('./packages/angular/angular-components/package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != package version v$VERSION"; exit 1; }
      - run: npm --prefix packages/angular ci
      - run: npm --prefix packages/angular test
      - run: npm --prefix packages/angular run build
      - name: Publish
        working-directory: packages/angular/dist/angular-components
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
